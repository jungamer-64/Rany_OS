[package]
name = "virtio_driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "VirtIO Driver for RanyOS"

[lib]
path = "src/lib.rs"

[dependencies]
# HAL for MMIO and port I/O wrappers
hal = { path = "../../hal" }
kernel_api = { path = "../../interfaces/kernel_api" }
graphic_types = { path = "../../libs/graphic_types" }
spin = "0.10"
exorust_sync = { path = "../../libs/sync" }
log = "0.4"

[features]
default = []
std = []
# Build as a standalone cell with kernel-provided runtime stubs and exported ABI entry.
standalone = ["export_driver_entry", "kernel_api/cell_runtime"]
export_driver_entry = ["kernel_api/export_driver_entry"]
qemu-test-export = []
