[package]
name = "ahci_driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "AHCI Driver for RanyOS"

[lib]
path = "src/lib.rs"
# Note: Use 'cargo build --features standalone' with custom linker to produce standalone .a

[dependencies]
# HAL for MMIO and port I/O wrappers
hal = { path = "../../hal" }
kernel_api = { path = "../../interfaces/kernel_api" }
spin = "0.10"
x86_64 = "0.15"

[features]
default = []
# Enables panic handler and dummy allocator for freestanding build
standalone = ["export_driver_entry"]
# When building as a standalone plugin, export the C ABI driver entry symbol
export_driver_entry = []
