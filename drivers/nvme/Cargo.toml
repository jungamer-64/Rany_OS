[package]
name = "nvme_driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "NVMe Driver for RanyOS"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
# Default: rlib for kernel integration (statically linked)
# Standalone cell builds reuse the same crate with the `standalone` feature.

[dependencies]
# HAL for MMIO and port I/O wrappers
hal = { path = "../../hal" }
kernel_api = { path = "../../interfaces/kernel_api" }
spin = "0.10"
exorust_sync = { path = "../../libs/sync" }
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
log = "0.4"

[features]
default = []
# Standalone cell build: exported ABI entry plus kernel-backed runtime stubs.
# To build standalone: 
#   1. Change crate-type to ["cdylib"] temporarily
#   2. cargo build --features standalone --release
#   3. Output: target/release/libnvme_driver.so (or .dll) → rename to nvme.cell
standalone = ["export_driver_entry", "kernel_api/cell_runtime"]
# Export _exorust_driver_entry symbol for dynamic loading
export_driver_entry = ["kernel_api/export_driver_entry"]
