[package]
name = "hda_driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Intel High Definition Audio (HDA) driver components"

[lib]
path = "src/lib.rs"

[dependencies]
hal = { path = "../../hal" }
kernel_api = { path = "../../interfaces/kernel_api" }
spin = "0.10"
x86_64 = "0.15"
pci_driver = { path = "../pci" }
log = "0.4"

[features]
default = []
# Build as a standalone cell with kernel-provided runtime stubs and exported ABI entry.
standalone = ["export_driver_entry", "kernel_api/cell_runtime"]
export_driver_entry = ["kernel_api/export_driver_entry"]
