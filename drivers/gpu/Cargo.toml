[package]
name = "gpu_driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "GPU Driver for RanyOS"

[lib]
path = "src/lib.rs"
# Note: Use 'cargo build --features standalone' with custom linker to produce standalone .a

[dependencies]
graphic_types = { path = "../../libs/graphic_types" }

# HAL for MMIO and port I/O wrappers
hal = { path = "../../hal" }
kernel_api = { path = "../../interfaces/kernel_api" }

[features]
default = []
# Enables panic handler and dummy allocator for freestanding build
standalone = ["export_driver_entry"]
export_driver_entry = []
