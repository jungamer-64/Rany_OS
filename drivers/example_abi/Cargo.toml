[package]
name = "example_abi_driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Example ABI Driver for RanyOS"

[lints]
workspace = true

[lib]
name = "example_abi"
path = "src/lib.rs"
# Default: rlib for kernel integration (statically linked)
crate-type = ["rlib"]

[dependencies]
kernel_api = { path = "../../interfaces/kernel_api" }

[features]
default = []
# Standalone: build as a standalone Cell (enables export symbol and cell runtime stub)
standalone = ["export_driver_entry", "kernel_api/cell_runtime"]
# Feature to enable exporting driver entry symbol for dynamic loader
export_driver_entry = ["kernel_api/export_driver_entry"]
