[package]
name = "usb_driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "USB Driver for RanyOS"

[lib]
path = "src/lib.rs"
# Note: `standalone` enables the kernel-backed cell runtime plus the exported
# driver entry symbol for standalone cell builds.
# For normal static linking with kernel, rlib is sufficient

[dependencies]
# HAL for MMIO and port I/O wrappers
hal = { path = "../../hal" }
spin = "0.10"
log = "0.4"
kernel_api = { path = "../../interfaces/kernel_api" }
hid_driver = { path = "../hid" }
vfs = { path = "../../filesystems/vfs", optional = true }

[features]
default = []
# Enables VFS integration for block device support
vfs_integration = ["vfs"]
# Build as a standalone cell with kernel-provided runtime stubs and exported ABI entry.
standalone = ["export_driver_entry", "kernel_api/cell_runtime"]
export_driver_entry = ["kernel_api/export_driver_entry"]
