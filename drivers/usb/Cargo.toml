[package]
name = "usb_driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "USB Driver for RanyOS"

[lib]
path = "src/lib.rs"
# Note: Use 'cargo build --features standalone' with custom linker to produce standalone .a
# For normal static linking with kernel, rlib is sufficient

[dependencies]
# HAL for MMIO and port I/O wrappers
hal = { path = "../../hal" }
spin = "0.9.8"
kernel_api = { path = "../../interfaces/kernel_api" }

[features]
default = []
# Enables panic handler and dummy allocator for freestanding build
standalone = ["export_driver_entry"]
export_driver_entry = []
