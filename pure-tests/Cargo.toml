[package]
name = "pure_tests"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Host/std pure smoke test aggregation for Rany_OS"

[dependencies]
security = { path = "../libs/security", features = ["qemu-test-export"] }
kernel_api = { path = "../interfaces/kernel_api", features = ["qemu-test-export"] }
exorust_sync = { path = "../libs/sync", features = ["qemu-test-export"] }
graphic_types = { path = "../libs/graphic_types", features = ["alloc", "qemu-test-export"] }

hid_driver = { path = "../drivers/hid", features = ["qemu-test-export"] }
pci_driver = { path = "../drivers/pci", features = ["qemu-test-export"] }
acpi_driver = { path = "../drivers/acpi", features = ["qemu-test-export"] }
ahci_driver = { path = "../drivers/ahci", features = ["qemu-test-export"] }
hda_driver = { path = "../drivers/hda", features = ["qemu-test-export"] }
nvme_driver = { path = "../drivers/nvme", features = ["qemu-test-export"] }
usb_driver = { path = "../drivers/usb", features = ["qemu-test-export"] }
virtio_driver = { path = "../drivers/virtio", features = ["qemu-test-export"] }
time_driver = { path = "../drivers/time", features = ["qemu-test-export"] }

vfs = { path = "../filesystems/vfs", features = ["qemu-test-export"] }
fat32 = { path = "../filesystems/fat32", features = ["qemu-test-export"] }

exorust_apps = { path = "../apps", features = ["qemu-test-export"] }
cap_harness = { path = "../tools/cap_harness", features = ["qemu-test-export"] }

[features]
default = []
qemu-test-export = []
