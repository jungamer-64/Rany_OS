# This file enables building a local copy of core/alloc/compiler_builtins
# for cross-target builds where that is required. It is intentionally
# separate from `.cargo/config.toml` so it can be opted into when needed
# without affecting the default host test behaviour (which can encounter
# duplicate-lang-item E0152 issues when both sysroot and local std artifacts
# are present).

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
