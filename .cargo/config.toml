# Build-std is intentionally disabled in the workspace default config to avoid
# duplicate-lang-item (E0152) errors when running host tests.
# Use `config.build-std.toml` or pass `-Z 'build-std=...'` on the command line when
# you need to build a local copy of core/alloc/compiler_builtins for cross-target
# builds (e.g. kernel cross-builds). The separate file is `.cargo/config.build-std.toml`.

[unstable]
panic-abort-tests = true

[build]
# Reproducible builds: normalize local workspace path.
rustflags = [
    "--remap-path-prefix=/home/jgm64=.",
]

# Custom kernel target with PIE disabled and higher-half linker script
# Note: For JSON targets, use the full path including .json extension
[target.x86_64-exorust]
rustflags = [
    "-C",
    "relocation-model=static",
    "-C",
    "code-model=kernel",
    "-C",
    "link-arg=--no-gc-sections",
    "-C",
    "link-arg=--no-pie",
    "-C",
    "link-arg=-Map=kernel.map",
    # "-C",
    # "force-frame-pointers=yes", # Uncomment for better stack traces
]

# Kernel unit test target: identity-mapped at 1MB, small code model
[target.x86_64-exorust-test]
rustflags = [
    "-C",
    "relocation-model=static",
    "-C",
    "code-model=small",
    "-C",
    "link-arg=--no-gc-sections",
    "-C",
    "link-arg=--no-pie",
    "-C",
    "link-arg=-Map=kernel-test.map",
]

[target.'cfg(target_os = "none")']
runner = ["pwsh", "scripts/run.ps1", "-CargoRunner", "-CargoKernelPath"]

[env]
# QEMU suite tests run in isolated subprocesses (`panic-abort-tests = true`),
# so forcing one test thread avoids spawning multiple QEMU instances at once.
RUST_TEST_THREADS = "1"
