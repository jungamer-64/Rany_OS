[alias]
# Alias for xtask commands
xtask = "run --package xtask --"

[unstable]
# Build-std is intentionally moved to `.cargo/config.build-std.toml` and must be
# opted into explicitly when cross-building or when local std components must
# be compiled. Keeping it enabled by default caused duplicate-lang-item E0152
# issues in host-side release/criterion benches.
