[alias]
# Alias for xtask commands
xtask = "run --package xtask --"

# Temporarily enable building standard library components from source for the
# entire workspace to avoid mixing sysroot-provided std artifacts with
# locally-built ones during host test runs. This is an experimental change to
# investigate and potentially work around duplicate-lang-item (E0152) errors
# that occur when `core`/`alloc` are linked from both the sysroot and
# workspace target dir.
[build]
# Build core, alloc, and compiler_builtins locally when requested
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
