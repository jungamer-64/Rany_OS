[package]
name = "hal"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Hardware Abstraction Layer for RanyOS"
categories.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# No standard library dependencies, keep it no_std.
# Only port-I/O helpers are needed here; avoid x86_64's nightly default feature set.
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }

[features]
default = []
std = []
