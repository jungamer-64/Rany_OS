name: Performance Bench

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bench:
    name: Run framebuffer benchmarks
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.compare.outputs.report }}
      comparison: ${{ steps.compare.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Criterion benches (programmatic runner)
        id: run_bench
        run: |
          cargo run --manifest-path tools/framebuffer_bench/Cargo.toml --release -- criterion

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framebuffer-criterion-results
          path: target/criterion

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: |
          # Capture compare output and make it available to later steps via GITHUB_OUTPUT
          set +e
          python3 tools/framebuffer_bench/compare_bench.py --threshold 0.10 | tee compare_output.txt
          rc=${PIPESTATUS[0]}
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat compare_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ "$rc" -ne 0 ]; then exit 1; fi

      - name: Fail on regression
        if: steps.compare.outcome == 'failure'
        run: |
          echo "Regression detected by compare_bench.py; failing job"
          exit 1

  comment:
    needs: bench
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.bench.outputs.comparison == 'success' || needs.bench.outputs.comparison == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create PR comment with benchmark results
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Framebuffer Benchmark Report**

            Status: ${{ needs.bench.outputs.comparison }}

            ${{ needs.bench.outputs.report }}
