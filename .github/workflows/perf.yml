name: Performance Bench

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  bench:
    name: Run framebuffer benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Criterion benches (programmatic runner)
        id: run_bench
        run: |
          cargo run --manifest-path tools/framebuffer_bench/Cargo.toml --release -- criterion

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framebuffer-criterion-results
          path: target/criterion

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: |
          # Capture compare output and make it available to later steps via GITHUB_OUTPUT
          set +e
          python3 tools/framebuffer_bench/compare_bench.py --threshold 0.10 | tee compare_output.txt
          rc=${PIPESTATUS[0]}
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat compare_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ "$rc" -ne 0 ]; then exit 1; fi

      - name: Create PR comment with benchmark results
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Framebuffer Benchmark Report**

            Status: ${{ steps.compare.conclusion }}

            ${{ steps.compare.outputs.report }}

      - name: Fail on regression
        if: steps.compare.conclusion == 'failure'
        run: |
          echo "Regression detected by compare_bench.py; failing job"
          exit 1
