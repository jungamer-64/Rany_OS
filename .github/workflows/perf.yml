name: Performance Bench

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  bench:
    name: Run framebuffer benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: nightly-2026-08-23
          profile: minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Criterion benches (programmatic runner)
        id: run_bench
        run: |
          cargo run --manifest-path tools/framebuffer_bench/Cargo.toml --release -- criterion

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framebuffer-criterion-results
          path: target/criterion

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: |
          # Capture compare output and make it available to later steps via GITHUB_OUTPUT
          set +e
          python3 tools/framebuffer_bench/compare_bench.py --threshold 0.10 | tee compare_output.txt
          rc=${PIPESTATUS[0]}
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat compare_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ "$rc" -ne 0 ]; then exit 1; fi

      - name: Create PR comment with benchmark results
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Framebuffer Benchmark Report**

            Status: ${{ steps.compare.conclusion }}

            ${{ steps.compare.outputs.report }}

      - name: Fail on regression
        if: steps.compare.conclusion == 'failure'
        run: |
          echo "Regression detected by compare_bench.py; failing job"
          exit 1
