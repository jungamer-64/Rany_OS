name: CI — Format, Lint, Tests, Audit

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  fmt-clippy:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: "Clippy: security"
        run: cargo clippy -p security -- -D warnings

      - name: "Clippy: cap_harness (host)"
        run: cargo clippy --manifest-path tools/cap_harness/Cargo.toml --target x86_64-unknown-linux-gnu -- -D warnings

      - name: "Clippy: graphic_types"
        run: cargo clippy -p graphic_types -- -D warnings

      - name: Verify pure tier map
        run: python3 scripts/verify_pure_tier_map.py

      - name: Run ExoRust reduction guard
        run: bash scripts/check-exorust-reduction-guard.sh

  audit:
    name: Security & static audit (optional)
    runs-on: ubuntu-latest
    needs: fmt-clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}
          components: clippy

      - name: Try running serena_audit
        run: |
          if command -v serena_audit >/dev/null 2>&1; then
            serena_audit --rootPath "$GITHUB_WORKSPACE" --mode strict || (echo "serena_audit failed" && exit 1)
          else
            echo "serena_audit not installed; skipping. See docs/ for instructions to enable it.";
          fi

      - name: Try running codacy_cli_analyze
        run: |
          if command -v codacy_cli_analyze >/dev/null 2>&1; then
            codacy_cli_analyze --rootPath "$GITHUB_WORKSPACE" || (echo "codacy_cli_analyze failed" && exit 1)
          else
            echo "codacy_cli_analyze not installed; skipping. See docs/ for instructions to enable it.";
          fi

      - name: cargo audit (optional)
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit
