name: ExoRust CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ============================================================================
  # Build Job
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
      with:
        components: rust-src, llvm-tools-preview
    
    - name: Ensure no duplicate '-T' in .cargo/config
      run: |
        if [ -f .cargo/config.toml ]; then
          if grep -nF "link-arg=-Tlinker.ld" .cargo/config.toml; then
            echo "ERROR: '.cargo/config.toml' contains '-C link-arg=-Tlinker.ld'. Remove it to avoid duplicate -T flags."
            exit 1
          else
            echo "OK: no duplicate -T in .cargo/config.toml"
          fi
        else
          echo "No .cargo/config.toml found, skipping check."
        fi

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Build kernel
      run: cargo build --target x86_64-exorust.json

    - name: Install pyelftools
      run: pip install pyelftools

    - name: Check linker layout
      run: python scripts/check_linker_layout.py || (echo 'Linker layout check failed.' && exit 1)
    
    - name: Build release
      run: cargo build --target x86_64-exorust.json --release
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-binary
        path: target/x86_64-exorust/debug/exorust_kernel
        retention-days: 7

  # ============================================================================
  # Compat OFF Build Job
  # ============================================================================
  compat-off:
    name: Build (posix-compat OFF)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
      with:
        components: rust-src, llvm-tools-preview

    - name: Build kernel without default features
      run: cargo build -p rany_kernel --no-default-features --target x86_64-exorust.json

  # ============================================================================
  # Reproducible Build Check
  # ============================================================================
  reproducible-build:
    name: Reproducible Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
      with:
        components: rust-src, llvm-tools-preview

    - name: Build release (run A)
      env:
        CARGO_TARGET_DIR: target/repro-a
      run: cargo build --target x86_64-exorust.json --release

    - name: Build release (run B)
      env:
        CARGO_TARGET_DIR: target/repro-b
      run: cargo build --target x86_64-exorust.json --release

    - name: Compare SHA-256
      run: |
        set -euo pipefail
        KERNEL_A=target/repro-a/x86_64-exorust/release/exorust_kernel
        KERNEL_B=target/repro-b/x86_64-exorust/release/exorust_kernel
        SHA_A="$(sha256sum "$KERNEL_A" | awk '{print $1}')"
        SHA_B="$(sha256sum "$KERNEL_B" | awk '{print $1}')"
        echo "run A: $SHA_A"
        echo "run B: $SHA_B"
        test "$SHA_A" = "$SHA_B"

  # ============================================================================
  # Lint Job
  # ============================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
      with:
        components: rustfmt, clippy, rust-src
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Clippy lints
      run: cargo clippy --target x86_64-exorust.json -- -D warnings
      continue-on-error: true  # no_std環境では一部警告が出る可能性

    - name: ProcessId allowlist check
      run: bash scripts/check-posix-compat.sh

  # ============================================================================
  # Documentation Job
  # ============================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
      with:
        components: rust-src
    
    - name: Build docs
      run: cargo doc --target x86_64-exorust.json --no-deps
      continue-on-error: true  # no_std環境のdoc生成
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: target/x86_64-exorust/doc
        retention-days: 7

  # ============================================================================
  # Code Quality Job
  # ============================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Count lines of code
      run: |
        echo "=== Source Files ==="
        find src -name '*.rs' | wc -l
        echo "=== Lines of Code ==="
        find src -name '*.rs' -exec cat {} \; | wc -l
    
    - name: Count unsafe blocks
      run: |
        echo "=== Unsafe Blocks ==="
        grep -r "unsafe" src --include="*.rs" | wc -l || echo "0"
    
    - name: Check for TODO/FIXME
      run: |
        echo "=== TODOs ==="
        grep -rn "TODO\|FIXME" src --include="*.rs" || echo "None found"

  # ============================================================================
  # Driver Isolation Check
  # ============================================================================
  driver-isolation:
    name: Driver Isolation Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify drivers don't depend on kernel
      run: |
        echo "=== Checking driver dependencies ==="
        FAILED=0
        for driver in drivers/*/Cargo.toml; do
          if [ -f "$driver" ]; then
            DRIVER_NAME=$(dirname "$driver")
            if grep -q 'rany_kernel' "$driver" || grep -q 'path.*kernel' "$driver"; then
              echo "❌ $DRIVER_NAME: depends on kernel crate!"
              FAILED=1
            else
              echo "✅ $DRIVER_NAME: properly isolated"
            fi
          fi
        done
        if [ $FAILED -eq 1 ]; then
          echo ""
          echo "ERROR: Drivers must only depend on kernel_api, not kernel!"
          exit 1
        fi
    
    - name: Verify drivers export ABI symbols
      run: |
        echo "=== Checking for ABI exports ==="
        for driver in drivers/*/src/ffi.rs; do
          if [ -f "$driver" ]; then
            if grep -q '_exorust_driver_entry' "$driver"; then
              echo "✅ $(dirname $(dirname $driver)): exports _exorust_driver_entry"
            else
              echo "⚠️  $(dirname $(dirname $driver)): no _exorust_driver_entry found"
            fi
          fi
        done
    
    - name: Check ABI version consistency
      run: |
        echo "=== ABI version check ==="
        ABI_VERSION=$(grep 'DRIVER_ABI_VERSION.*=' interfaces/kernel_api/src/driver_abi.rs | head -1)
        echo "kernel_api: $ABI_VERSION"

  # ============================================================================
  # Security Audit Job
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run security audit
      run: cargo audit
      continue-on-error: true  # no_stdの依存関係は制限されている

  # ============================================================================
  # Release Job
  # ============================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
      with:
        components: rust-src, llvm-tools-preview
    
    - name: Build release
      run: cargo build --target x86_64-exorust.json --release
    
    - name: Get version
      id: version
      run: echo "version=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
    
    - name: Create release archive
      run: |
        mkdir -p release
        cp target/x86_64-exorust/release/exorust_kernel release/ 2>/dev/null || true
        cp target/x86_64-exorust/debug/exorust_kernel release/exorust_kernel-debug 2>/dev/null || true
        cp README.md release/
        cp docs/API_REFERENCE.md release/
        cp docs/ARCHITECTURE.md release/
        tar -czvf exorust-${{ steps.version.outputs.version }}.tar.gz release/
    
    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: exorust-release
        path: exorust-*.tar.gz
        retention-days: 30
