name: Codacy analysis (Docker)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  codacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '27'
          problem-matcher: true

      - name: Ensure Docker is available
        run: |
          docker version

      - name: Run Codacy analysis
        run: |
          chmod +x tools/codacy/ci_run_codacy.sh
          ./tools/codacy/ci_run_codacy.sh
        env:
          CI: true

      - name: Upload Codacy results and logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codacy-results
          path: |
            tools/codacy/results_*_ci.json
            tools/codacy/ci_metrics.log
            tools/codacy/ci_full.log
            tools/codacy/failed_read_files_metrics.txt
            tools/codacy/failed_read_files_full.txt
            tools/codacy/utf8_issues/**
