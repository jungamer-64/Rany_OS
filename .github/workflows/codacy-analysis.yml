name: Codacy analysis (Docker)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  codacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '27'

      - name: Ensure Docker is available
        run: |
          docker version

      - name: Run Codacy analysis
        run: |
          chmod +x tools/codacy/ci_run_codacy.sh
          ./tools/codacy/ci_run_codacy.sh
        env:
          CI: true

      - name: Upload Codacy results and logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codacy-results
          path: |
            tools/codacy/results_*_ci.json
            tools/codacy/ci_metrics.log
            tools/codacy/ci_full.log
            tools/codacy/failed_read_files_metrics.txt
            tools/codacy/failed_read_files_full.txt
            tools/codacy/utf8_issues/**
