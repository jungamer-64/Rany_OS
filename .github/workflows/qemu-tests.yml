name: QEMU Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  required-suites:
    name: Required QEMU suites (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, drivers, fs, graphics, kernel, tools]
        cpu: ["qemu64,+rdtscp"]
        memory_mb: [512]
        smp: [1]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools-preview

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Verify legacy #[test] allowlist
        run: bash scripts/verify_qemu_test_only.sh

      - name: Verify IOMMU AMD Wave4 required wiring
        run: bash scripts/verify_iommu_amd_wave4_required.sh

      - name: Run suite
        env:
          QEMU_TEST_CPU: ${{ matrix.cpu }}
          QEMU_TEST_MEMORY_MB: ${{ matrix.memory_mb }}
          QEMU_TEST_SMP: ${{ matrix.smp }}
          QEMU_TEST_TIMEOUT_SECS: 90
        run: |
          if [ "${{ matrix.suite }}" = "kernel" ]; then
            for run in 1 2 3; do
              echo "kernel stability run ${run}/3"
              cargo test -p qemu-tests -- --nocapture suite_kernel
            done
          else
            cargo test -p qemu-tests -- --nocapture suite_${{ matrix.suite }}
          fi

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs-${{ matrix.suite }}
          path: |
            target/qemu-logs
            scripts/qemu_legacy_test_allowlist.lst
          if-no-files-found: ignore

  pending-suite:
    name: Pending QEMU suite (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools-preview

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Verify legacy #[test] allowlist
        run: bash scripts/verify_qemu_test_only.sh

      - name: Verify IOMMU residual parity mapping
        run: bash scripts/verify_iommu_residual_parity.sh

      - name: Verify IOMMU AMD Wave4 required wiring
        run: bash scripts/verify_iommu_amd_wave4_required.sh

      - name: Verify IOMMU AMD Wave5 runtime-pending wiring
        run: bash scripts/verify_iommu_amd_wave5_runtime_pending.sh

      - name: Run runtime pending and pending suite
        env:
          QEMU_TEST_CPU: qemu64,+rdtscp
          QEMU_TEST_MEMORY_MB: 512
          QEMU_TEST_SMP: 1
          QEMU_TEST_TIMEOUT_SECS: 90
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "kernel runtime pending monitor run ${run}/3"
            cargo test -p qemu-tests -- --ignored --nocapture suite_kernel_runtime_pending
            python3 - target/qemu-logs/kernel-runtime-pending-summary.json <<'PY'
import json
import pathlib
import sys

summary_path = pathlib.Path(sys.argv[1])
if not summary_path.exists():
    print(f"missing runtime summary: {summary_path}", file=sys.stderr)
    raise SystemExit(1)

summary = json.loads(summary_path.read_text(encoding="utf-8"))
checks = (
    ("amd_failed_count", 0),
    ("amd_blocked_count", 0),
    ("amd_expected_count", 11),
    ("amd_observed_count", 11),
)
errors = []
for key, expected in checks:
    actual = summary.get(key)
    if actual != expected:
        errors.append(f"{key}={actual} (expected {expected})")

if summary.get("amd_execution_guard_passed") is not True:
    errors.append("amd_execution_guard_passed != true")

if errors:
    print("Wave5 runtime pending monitor check failed:", file=sys.stderr)
    for item in errors:
        print(f"- {item}", file=sys.stderr)
    raise SystemExit(1)

print(
    "Wave5 runtime pending monitor check passed:",
    f"amd_expected_count={summary.get('amd_expected_count')}",
    f"amd_observed_count={summary.get('amd_observed_count')}",
)
PY
          done
          cargo test -p qemu-tests -- --ignored --nocapture suite_pending

      - name: Upload pending logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs-pending
          path: |
            target/qemu-logs
            target/qemu-logs/pending-summary.txt
            target/qemu-logs/pending-summary.json
            target/qemu-logs/kernel-runtime-pending-summary.txt
            target/qemu-logs/kernel-runtime-pending-summary.json
            scripts/qemu_pending_cases.lst
            scripts/qemu_iommu_residual_parity.lst
            scripts/qemu_legacy_test_allowlist.lst
          if-no-files-found: ignore
