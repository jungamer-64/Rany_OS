name: QEMU Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  required-suites:
    name: Required QEMU suites (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, drivers, fs, kernel, tools]
        cpu: ["qemu64,+rdtscp"]
        memory_mb: [512]
        smp: [1]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Verify legacy #[test] allowlist
        run: bash scripts/verify_qemu_test_only.sh

      - name: Run suite
        env:
          QEMU_TEST_CPU: ${{ matrix.cpu }}
          QEMU_TEST_MEMORY_MB: ${{ matrix.memory_mb }}
          QEMU_TEST_SMP: ${{ matrix.smp }}
          QEMU_TEST_TIMEOUT_SECS: 90
        run: cargo test -p qemu-tests -- --nocapture suite_${{ matrix.suite }}

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs-${{ matrix.suite }}
          path: target/qemu-logs
          if-no-files-found: ignore

  pending-suite:
    name: Pending QEMU migration suite
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: required-suites

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Verify legacy #[test] allowlist
        run: bash scripts/verify_qemu_test_only.sh

      - name: Run pending suite
        env:
          QEMU_TEST_TIMEOUT_SECS: 90
        run: cargo test -p qemu-tests -- --nocapture suite_pending

      - name: Upload pending suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs-pending
          path: target/qemu-logs
          if-no-files-found: ignore
