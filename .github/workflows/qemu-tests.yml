name: QEMU Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"

jobs:
  pure-pr-required:
    name: Pure tests (PR required)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Generate signing keys
        run: |
          if [ ! -f keys/kernel.key ] || [ ! -f keys/kernel_pub.key ]; then
            cargo run --quiet --manifest-path tools/signer/Cargo.toml -- keygen --output-dir keys
          fi

      - name: Verify pure tier map
        run: python3 scripts/verify_pure_tier_map.py

      - name: Run pure PR-required tier
        run: python3 scripts/run_pure_tier.py --tier pr-required

  fullboot-pr-required:
    name: Full-boot QEMU (PR required)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Generate signing keys
        run: |
          if [ ! -f keys/kernel.key ] || [ ! -f keys/kernel_pub.key ]; then
            cargo run --quiet --manifest-path tools/signer/Cargo.toml -- keygen --output-dir keys
          fi

      - name: Run full-boot PR-required tier
        env:
          RUST_TEST_THREADS: 1
          QEMU_TEST_ACCEL: tcg
          QEMU_TEST_CPU: qemu64,+rdtscp,+rdrand
          QEMU_TEST_MEMORY_MB: 512
          QEMU_TEST_SMP: 1
          QEMU_TEST_TIMEOUT_SECS: 240
        run: cargo test -p qemu-tests fullboot_pr_required -- --exact --nocapture

      - name: Upload full-boot logs (PR required)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-logs-fullboot-pr-required
          path: |
            target/qemu-logs
          if-no-files-found: ignore

  fullboot-network-smp4-pr-required:
    name: Full-boot QEMU network SMP=4 (PR required)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Generate signing keys
        run: |
          if [ ! -f keys/kernel.key ] || [ ! -f keys/kernel_pub.key ]; then
            cargo run --quiet --manifest-path tools/signer/Cargo.toml -- keygen --output-dir keys
          fi

      - name: Run network profile with four cores
        env:
          RUST_TEST_THREADS: 1
          QEMU_TEST_ACCEL: tcg
          QEMU_TEST_CPU: qemu64,+rdtscp,+rdrand
          QEMU_TEST_MEMORY_MB: 512
          QEMU_TEST_PROFILE_ONLY: network
          QEMU_TEST_SMP: 4
          QEMU_TEST_TIMEOUT_SECS: 240
        run: cargo test -p qemu-tests fullboot_pr_required -- --exact --nocapture

      - name: Upload network SMP=4 logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-logs-network-smp4-pr-required
          path: |
            target/qemu-logs
          if-no-files-found: ignore

  pure-nightly-required:
    name: Pure tests (nightly required)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Generate signing keys
        run: |
          if [ ! -f keys/kernel.key ] || [ ! -f keys/kernel_pub.key ]; then
            cargo run --quiet --manifest-path tools/signer/Cargo.toml -- keygen --output-dir keys
          fi

      - name: Verify pure tier map
        run: python3 scripts/verify_pure_tier_map.py

      - name: Run pure nightly-required tier
        run: python3 scripts/run_pure_tier.py --tier nightly-required --include-ignored

  fullboot-nightly-required:
    name: Full-boot QEMU (nightly required)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Generate signing keys
        run: |
          if [ ! -f keys/kernel.key ] || [ ! -f keys/kernel_pub.key ]; then
            cargo run --quiet --manifest-path tools/signer/Cargo.toml -- keygen --output-dir keys
          fi

      - name: Run full-boot nightly-required tier
        env:
          RUST_TEST_THREADS: 1
          QEMU_TEST_ACCEL: tcg
          QEMU_TEST_CPU: qemu64,+rdtscp,+rdrand
          QEMU_TEST_MEMORY_MB: 512
          QEMU_TEST_SMP: 1
          QEMU_TEST_TIMEOUT_SECS: 180
        run: cargo test -p qemu-tests fullboot_nightly_required -- --ignored --exact --nocapture

      - name: Upload full-boot logs (nightly required)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-logs-fullboot-nightly-required
          path: |
            target/qemu-logs
          if-no-files-found: ignore

  fullboot-step9-heavy:
    name: Full-boot QEMU (Step9 heavy)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repository Rust configuration
        id: rust-config
        run: python3 scripts/export_ci_rust_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust-config.outputs.toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-qemu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qemu-

      - name: Generate signing keys
        run: |
          if [ ! -f keys/kernel.key ] || [ ! -f keys/kernel_pub.key ]; then
            cargo run --quiet --manifest-path tools/signer/Cargo.toml -- keygen --output-dir keys
          fi

      - name: Run full-boot Step9 heavy profile
        env:
          RUST_TEST_THREADS: 1
          QEMU_TEST_ACCEL: tcg
          QEMU_TEST_CPU: qemu64,+rdtscp,+rdrand
          QEMU_TEST_MEMORY_MB: 1024
          QEMU_TEST_SMP: 1
          QEMU_TEST_TIMEOUT_SECS: 480
        run: cargo test -p qemu-tests fullboot_step9_heavy -- --ignored --exact --nocapture

      - name: Upload full-boot logs (Step9 heavy)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-logs-fullboot-step9-heavy
          path: |
            target/qemu-logs
          if-no-files-found: ignore
