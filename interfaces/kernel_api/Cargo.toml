[package]
name = "kernel_api"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Kernel API Interface - Shared types and traits for ExoRust OS"

[lints]
workspace = true

[lib]
name = "kernel_api"
path = "src/lib.rs"

[dependencies]
hal = { path = "../../hal" }
# Shared initialization excludes local preemption until publication.
exorust_sync = { path = "../../libs/sync" }
log = "0.4"

[dev-dependencies]
# DMA authority tests use the raw host lock independently of kernel execution.
spin = "0.12"

[features]
# When set, generated driver macros will emit exported driver entry symbols
export_driver_entry = []
# Enable Cell runtime stubs (allocator, panic handler) for standalone cdylib builds
cell_runtime = []
