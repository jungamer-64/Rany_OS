## NOTE: This file used to set the kernel's default cross-compilation target
## and build-std options (e.g. `target = "x86_64-unknown-none"`,
## `build-std = ["core", ...]`). Those options are useful for building the
## kernel image, but they cause `cargo test` to try to run tests for the
## kernel target, which is not a host target and leads to duplicate `core`
## lang item errors when running tests locally.
##
## To run kernel cross-builds and builds for the kernel target, either:
##  - Use the helper scripts (e.g. `scripts/run.ps1` / `scripts/run.sh`) which
##    explicitly pass `--target x86_64-unknown-none`, or
##  - Manually set `--target x86_64-unknown-none` when invoking cargo,
##    e.g. `cargo build --target x86_64-unknown-none`.
##
## If you *really* need the old behavior (auto-target selection for the
## kernel), restore the configuration below by moving it into a file named
## `config.cross.toml` or uncommenting the lines.

# [build]
# target = "x86_64-unknown-none"

# [unstable]
# build-std = ["core", "compiler_builtins", "alloc"]
# build-std-features = ["compiler-builtins-mem"]

# [target.x86_64-unknown-none]
# runner = "pwsh ../scripts/run-uefi.ps1"
# rustflags = [
#     "-C", "code-model=kernel",
#     "-C", "relocation-model=static",
#     "-C", "link-arg=-T../linker.ld",
#     "--cfg", "curve25519_dalek_backend=\"serial\""
# ]
