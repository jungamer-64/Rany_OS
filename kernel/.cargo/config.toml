[build]
# Kernel target for cross-compilation
target = "x86_64-unknown-none"

[unstable]
# Build stdlibs for kernel target; restrict this to kernel workspace root only
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-none]
# Runner script and rustflags specific to kernel target
runner = "pwsh ../scripts/run-uefi.ps1"
rustflags = [
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    # Linker file lives in workspace root
    "-C", "link-arg=-T../linker.ld",
    # Disable curve25519-dalek SIMD backend for no_std environment
    "--cfg", "curve25519_dalek_backend=\"serial\""
]
