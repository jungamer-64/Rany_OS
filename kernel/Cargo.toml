[package]
name = "rany_kernel"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Single Address Space, Async-First Rust OS Kernel - Pure Performance Architecture"

[[bin]]
name = "exorust_kernel"
path = "src/main.rs"
test = false

[lib]
name = "rany_os"
path = "src/lib.rs"

# ============================================================================
# 依存関係
# ============================================================================

[dependencies]
# Kernel API Interface
kernel_api = { path = "../interfaces/kernel_api" }

# Graphics Types (pure data, no kernel dependency)
graphic_types = { path = "../libs/graphic_types", features = ["alloc"] }

# Drivers
pci_driver = { path = "../drivers/pci" }
ahci_driver = { path = "../drivers/ahci" }
hda_driver = { path = "../drivers/hda" }
nvme_driver = { path = "../drivers/nvme" }
usb_driver = { path = "../drivers/usb" }
hid_driver = { path = "../drivers/hid" }
gpu_driver = { path = "../drivers/gpu" }
virtio_driver = { path = "../drivers/virtio" }
acpi_driver = { path = "../drivers/acpi" }
ide_driver = { path = "../drivers/ide" }
serial_driver = { path = "../drivers/serial" }
apic_driver = { path = "../drivers/apic" }
time_driver = { path = "../drivers/time" }
mlx5_driver = { path = "../drivers/mlx5" }

# Filesystems
fat32 = { path = "../filesystems/fat32" }
nvme_ns = { path = "../filesystems/nvme_ns" }
vfs = { path = "../filesystems/vfs" }

# ブートローダーAPI（ExoLoader Protocol）
boot_proto = { path = "../libs/boot_proto" }
ap_trampoline = { path = "../libs/ap_trampoline" }

# Hardware Abstraction Layer (MMIO/Port I/O wrappers)
hal = { path = "../hal" }

# Security primitives (root certificates, capabilities, etc.)
security = { path = "../libs/security" }

# x86_64アーキテクチャサポート
x86_64 = "0.15"

# スピンロック（no_std互換）
spin = "0.10"

# Once-cell for lazy initialization (no_std compatible)
once_cell = { version = "1.20", default-features = false, features = ["race", "alloc"] }

# UART シリアル出力（デバッグ用）
uart_16550 = { version = "0.4", optional = true }

# ビットフィールド操作
bitflags = "2.4"

# DWARF情報解析（スタックアンワインド用）
gimli = { version = "0.32", default-features = false, features = ["read-core"] }

# no_std向けHashMap
hashbrown = "0.16"

# Ed25519署名検証 & X25519鍵交換用（no_std対応、curve25519-dalek不使用）
ed25519-compact = { version = "2", default-features = false, features = ["x25519"] }

# SHA-256ハッシュ計算用
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

# ログフレームワーク
log = "0.4"

# Criterion (moved from dev-dependencies for no_std test compatibility)
criterion = { version = "0.5", optional = true }

# ============================================================================
# フィーチャーフラグ
# ============================================================================

[features]
default = []
kernel_bin = []
debug_mlx5_cmd = ["mlx5_driver/debug_mlx5_cmd"]
verbose_logging = []
serial = ["uart_16550"]
stats = []
mouse = []
bench = ["std", "dep:criterion"]
qemu-test-export = ["full_mm_tests"]

# FreeList Buddy Allocator with page mobility + cache coloring.
# When enabled, UnifiedFrameAllocator routes user-page allocations through
# buddy_freelist for O(1) allocation and THP-friendly pageblock segregation.
buddy_freelist = []

# IOMMU Features
# ==============

# Enable lazy (deferred) IOTLB invalidation as the default unmap behavior.
# This improves throughput for high-frequency DMA operations by batching
# invalidations via the quarantine system. Use `unmap_sync()` when you need
# immediate completion guarantees.
async_unmap_default = []

apic = []
task = []
force_vga = []
gimli_unwind = []

# Test-only feature: enable PKEY allocation behavior inside tests so we can
# exercise loader->mpk integration without requiring a full kernel runtime.
# Usage: `cargo test -p rany_kernel --features pkey_integration_test`
pkey_integration_test = []

# Feature to enable running integration tests at boot (CI/e2e)
run-integration-tests = []

# Opt-in feature to compile the full `mm` tree for running mm-level unit tests
# directly under `cargo test --features full_mm_tests`. This avoids pulling
# the heavy memory subsystem by default into the library test harness.
full_mm_tests = []

std = ["hal/std"]


[dev-dependencies]
graphic_types = { path = "../libs/graphic_types", features = ["alloc"] }
boot_proto = { path = "../libs/boot_proto" }
spin = "0.10"

# ============================================================================
# ブートイメージ設定
# ============================================================================

[package.metadata.bootimage]
build-command = ["build"]
run-command = [
    "qemu-system-x86_64",
    "-drive",
    "format=raw,file={}",
    "-serial",
    "stdio",
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-display",
    "none",
]

test-args = [
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "stdio",
    "-display",
    "none",
]
test-success-exit-code = 33
test-timeout = 300



[[bench]]
name = "framebuffer_bench"
harness = false
required-features = ["bench"]

# NOTE:
# `kernel/tests/*` integration targets are intentionally removed.
# QEMU migration tests must be exported via `qemu-test-export` and executed
# via crate-local host tests (host/std) or kernel runtime full-boot
# (`qemu-tests`).
