[workspace]
resolver = "2"
members = [
    # Core
    "kernel",
    "hal",
    "interfaces/kernel_api",
    # Libs
    "libs/app_sdk",
    "libs/security",
    "libs/graphic_types",
    "libs/vfs",
    # Filesystems
    "filesystems/fat32",
    # Drivers
    "drivers/pci",
    "drivers/ahci",
    "drivers/usb",
    "drivers/nvme",
    "drivers/serial",
    "drivers/gpu",
    "drivers/hid",
    "drivers/hda",
    "drivers/virtio",
    "drivers/acpi",
    "drivers/rtc",
    "drivers/ide",
    "drivers/example_abi",
    # Apps
    "apps",
    "tools/cap_harness",
    "libs/boot_proto",
    "bootloader",
    # NOTE: `tools/framebuffer_bench` and `tools/signer` are intentionally not workspace members
    # to avoid workspace-wide `build-std` / duplicate-lang-item (E0152) issues.
    # They are runnable via their manifest paths.
]
exclude = ["tools/framebuffer_bench", "tools/signer"]


[workspace.package]
edition = "2024"
authors = ["ExoRust Team"]
license = "MIT"
repository = "https://github.com/Start-Rany-OS/Rany_OS"
readme = "README.md"
keywords = ["os", "kernel", "rust"]
categories = ["os"]

# ============================================================================
# ブートイメージ設定（Workspace全体）
# ============================================================================

[workspace.metadata.bootimage]
build-command = ["build"]
run-command = [
    "qemu-system-x86_64",
    "-drive",
    "format=raw,file={}",
    "-serial",
    "stdio",
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-display",
    "none",
]

test-args = [
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "stdio",
    "-display",
    "none",
]
test-success-exit-code = 33
test-timeout = 300

# ============================================================================
# ビルドプロファイル
# ============================================================================

[profile.dev]
panic = "abort"
opt-level = 0
debug = true

#[profile.dev.package."*"]
#opt-level = 3
#debug = false
#NOTE: package-specific dev overrides are intentionally disabled because
#they caused build profile inconsistencies between dev and test which led
#to duplicate compilation of core with differing panic strategies.

[profile.release]
panic = "abort"
lto = true
opt-level = 3
debug = true

[profile.test]
panic = "abort"
opt-level = 1
