[workspace]
resolver = "2"
members = [
    "kernel",
]

[workspace.package]
edition = "2024"
authors = ["ExoRust Team"]

# ============================================================================
# ブートイメージ設定（Workspace全体）
# ============================================================================

[workspace.metadata.bootimage]
build-command = ["build"]
run-command = [
    "qemu-system-x86_64",
    "-drive", "format=raw,file={}",
    "-serial", "stdio",
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-display", "none"
]

test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout = 300

# ============================================================================
# ビルドプロファイル
# ============================================================================

[profile.dev]
panic = "abort"
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
panic = "abort"
lto = true
opt-level = 3
debug = true

[profile.test]
panic = "abort"
opt-level = 1