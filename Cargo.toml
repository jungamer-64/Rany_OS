[workspace]
resolver = "2"
members = [
    # QEMU-first test orchestration
    "qemu-tests",
    "qemu-suites/core",
    "qemu-suites/drivers",
    "qemu-suites/fs",
    "qemu-suites/kernel",
    "qemu-suites/kernel-runtime-pending",
    "qemu-suites/graphics",
    "qemu-suites/tools",
    "qemu-suites/pending",
    "tools/qemu_runner",
    # Core
    "kernel",
    "hal",
    "interfaces/kernel_api",
    # Libs
    "libs/app_sdk",
    "libs/security",
    "libs/graphic_types",
    "filesystems/vfs",
    "libs/sync",
    # Filesystems
    "filesystems/fat32",
    # Drivers
    "drivers/pci",
    "drivers/ahci",
    "drivers/usb",
    "drivers/nvme",
    "drivers/serial",
    "drivers/gpu",
    "drivers/hid",
    "drivers/hda",
    "drivers/virtio",
    "drivers/acpi",
    "drivers/rtc",
    "drivers/ide",
    "drivers/time",
    "drivers/example_abi",
    "drivers/driver_cell_probe",
    # Apps
    "apps",
    "libs/boot_proto",
    "bootloader",
    # dev tool: symbol lookup helper (not part of standard critical tools)
    # "tools/symlookup",
    # NOTE: `tools/framebuffer_bench`, `tools/signer`, `tools/cap_harness` and `tools/symlookup` are intentionally not workspace members
    # to avoid workspace-wide `build-std` / duplicate-lang-item (E0152) issues.
    # They are runnable via their manifest paths.
]
exclude = ["tools/framebuffer_bench", "tools/signer", "tools/cap_harness", "tools/symlookup"]
default-members = ["qemu-tests"]

[workspace.package]
edition = "2024"
authors = ["ExoRust Team"]
license = "MIT"
repository = "https://github.com/Start-Rany-OS/Rany_OS"
readme = "README.md"
keywords = ["os", "kernel", "rust"]
categories = ["os"]

# ============================================================================
# ブートイメージ設定（Workspace全体）
# ============================================================================

[workspace.metadata.bootimage]
build-command = ["build"]
run-command = [
    "qemu-system-x86_64",
    "-drive",
    "format=raw,file={}",
    "-serial",
    "stdio",
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-display",
    "none",
]

test-args = [
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "stdio",
    "-display",
    "none",
]
test-success-exit-code = 33
test-timeout = 300

# ============================================================================
# ビルドプロファイル
# ============================================================================

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
# Use split-debuginfo to keep DWARF and other debug sections out-of-band for dev builds.
# This avoids embedding large .debug* sections in the kernel ELF which can cause
# loadable segment file-offset overlaps when linking with lld.
split-debuginfo = "unpacked"


#[profile.dev.package."*"]
#opt-level = 3
#debug = false
#NOTE: package-specific dev overrides are intentionally disabled because
#they caused build profile inconsistencies between dev and test which led
#to duplicate compilation of core with differing panic strategies.

[profile.release]
panic = "abort"
lto = true
opt-level = 3
# Disable debug info and strip symbols for release kernel images to avoid
# embedding large debug/symbol sections that can overlap loadable ranges.
debug = false
strip = "symbols"
