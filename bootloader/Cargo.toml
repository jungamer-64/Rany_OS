[package]
name = "exoloader"
version = "0.1.0"
edition = "2024"
description = "UEFI Bootloader for RanyOS"
license = "MIT"
repository = "https://github.com/Start-Rany-OS/Rany_OS"
categories = ["os", "bootloader"]
keywords = ["uefi", "boot"]

[dependencies]
uefi = { version = "0.36", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
uefi-raw = "0.13"
log = "0.4"
xmas-elf = "0.10"
boot_proto = { path = "../libs/boot_proto" }
graphic_types = { path = "../libs/graphic_types" }
# Ed25519 signature verification for secure boot
# default-features = false disables std and random (RNG) - verification only needs core
ed25519-compact = { version = "2.1", default-features = false }

[features]
default = ["ui", "serial_log", "self_test"]
# ブートメニューUI（対話的なカーネル選択）
ui = []
# シリアルポートへのログ出力
serial_log = []
# 起動時セルフテスト（メモリ・ハードウェア検証）
self_test = []
# 開発用：署名なしカーネルのロードを許可（本番では絶対に使用禁止）
insecure_boot = []
# クラウド/本番用：最小構成（UIなし、テストなし、最速起動）
# 使用例: cargo build --no-default-features --features minimal
minimal = []
qemu-test-export = []

